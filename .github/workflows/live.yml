name: Live

# Network-backed checks are intentionally kept off pull requests. Runs are
# serialized because every test and executable catalog example shares the public
# MLS, NWSL, and American Soccer Analysis API capacity.

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: us-soccer-live
  cancel-in-progress: false

env:
  UV_NO_SOURCES: "1"

jobs:
  live:
    name: Live API tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --no-sources
      - run: uv run --no-sources pytest -q -m live

  behavioural:
    name: vgi-lint (executes every example)
    needs: live
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --no-sources
      - name: vgi-lint (structural + behavioural)
        run: >
          uvx --no-sources --from vgi-lint-check==2.5.0 vgi-lint lint "uv run --no-sources us_soccer_worker.py"
          --execute-concurrency 1 --no-check-links --audit-waivers --fail-on error
